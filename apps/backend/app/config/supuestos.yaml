# Supuestos del modelo. Cada valor indica su fuente o la palabra SUPUESTO.
margen_riesgo_m:
  valor: 0.50
  fuente: SUPUESTO
umbral_lluvia_camino_tierra_mm:
  valor: 30
  fuente: SUPUESTO
umbral_lluvia_camino_ripio_mm:
  valor: 80
  fuente: SUPUESTO
factor_desvio:
  valor: 1.3
  fuente: SUPUESTO
camion_jaula_bovinos:
  valor: 30
  fuente: SUPUESTO (pendiente tabla Anexo II Res. SENASA 581/2014)
vehiculo_cat_b_capacidad:
  valor: 40
  fuente: SUPUESTO

# --- Fase 2: motor de simulación ---
velocidad_kmh:
  valor:
    vehicular: {pavimento: 60, ripio: 40, tierra: 20, desconocida: 20}
    camion_jaula: {pavimento: 45, ripio: 30}
    arreo: {pavimento: 4, ripio: 4, tierra: 3, desconocida: 3}
  fuente: SUPUESTO (velocidades medias de traslado por superficie y perfil; el camión jaula no usa tierra ni superficie desconocida; desconocida cuesta como tierra)
arreo_penalizacion_zona_comprometida:
  valor: 3.0
  fuente: SUPUESTO (multiplica el costo de los tramos dentro de sectores comprometidos)
ruteo_distancia_maxima_a_red_m:
  valor: 5000
  fuente: SUPUESTO (si el origen o el destino están más lejos de la red cargada, se usa la estimación aproximada)
isad_pesos:
  valor: {lluvia_antecedente: 0.30, humedad_suelo: 0.20, concavidad: 0.20, rio: 0.30}
  fuente: SUPUESTO (índice relativo SIMULADO; no reemplaza el criterio de compromiso de K10)
isad_lluvia_saturacion_mm:
  valor: 100
  fuente: SUPUESTO (lluvia a partir de la cual el componente de lluvia vale 1)
isad_humedad_suelo_defecto:
  valor: 0.5
  fuente: SUPUESTO (sin dato de humedad en el kit)
isad_concavidad_sector:
  valor: {S1: 0.4, S2: 0.2, S3: 0.5, S4: 0.8}
  fuente: SUPUESTO (el kit no tiene cotas; S4 es rural, de baja pendiente y suelo arcilloso)
dormidero_m2_por_bovino:
  valor: 5
  fuente: INTA, 4 a 5 m² por animal (se usa el máximo; a verificar)
lote_maximo_cabezas:
  valor: 200
  fuente: INTA, lotes homogéneos de hasta 200 cabezas (a verificar)
racion_diaria_kg:
  valor:
    vaca_prenada: {maiz: 2.8, pellet_girasol: 0.2}
    vaca_vacia: {maiz: 2.8, pellet_girasol: 0.2}
    vaca_con_cria: {maiz: 3.1, pellet_girasol: 0.35}
    vaquillona: {maiz: 2.5, pellet_girasol: 0.2}
    toro: {maiz: 2.5, pellet_girasol: 0.2}
    novillo: {maiz: 2.5, pellet_girasol: 0.2}
    ternero: {maiz: 0.0, pellet_girasol: 0.0}
  fuente: INTA (a verificar). Vaca preñada 2,8 kg de maíz + 200 g de pellet; vaca con cría 3,0 a 3,2 kg + 200 a 500 g (se usan 3,1 y 0,35). Vaquillona, novillo y toro 2,5 kg + 0,2 kg y ternero al pie sin ración propia son SUPUESTO
ventana_inicio_ganado_horas:
  valor: [24, 48]
  fuente: SUPUESTO (anticipación recomendada del traslado de ganado respecto del compromiso previsto)
lluvia_max_mm_turno:
  valor: 500
  fuente: SUPUESTO (cota de validación de un parte de lluvia)
lluvia_vecinos:
  valor: {radio_km: 30, diferencia_mm: 40}
  fuente: SUPUESTO (comparación con puestos vecinos como advertencia, no como rechazo)
dias_proyeccion_horizonte:
  valor: 60
  fuente: SUPUESTO (horizonte máximo que muestra el tiempo restante; el INA no pronostica a más de 15 días)
velocidad_lancha_kmh:
  valor: 15
  fuente: SUPUESTO (traslado fluvial de sectores aislados)
acceso_red_vial_buffer_m:
  valor: 25
  fuente: SUPUESTO (radio alrededor de un acceso dentro del cual una arista de la red vial se considera ese mismo camino; si el acceso se cierra, se cortan las aristas contenidas en ese radio)

# --- Motor de evacuación: factibilidad, centros y reparto (odd/tasks/motor-evacuacion.md) ---
margen_seguridad_fraccion:
  valor: 0.25
  fuente: "SUPUESTO (parte del plazo más corto que debe quedar libre para que un plan 'alcanza', como holgura ante demoras; si termina dentro del plazo pero con menos holgura, es 'justo')"
ruteo_enganche_usable_m:
  valor: 500
  fuente: "SUPUESTO (un punto se engancha al nodo más cercano con un tramo usable para el perfil y la lluvia si está a no más de esta distancia adicional; si no, al nodo más cercano, aunque su tramo esté cerrado)"
hogar_tamano_distribucion:
  valor: {1: 0.15, 2: 0.20, 3: 0.20, 4: 0.18, 5: 0.12, 6: 0.08, 7: 0.04, 8: 0.03}
  fuente: "SUPUESTO (proporción de hogares por cantidad de personas para el set separado data/simulado/hogares_k10.json; promedio 3,5 personas; reemplazar por el cuadro del Censo 2022 de hogares por cantidad de personas de Formosa cuando se obtenga)"
centro_excluir_en_riesgo:
  valor: true
  fuente: "SUPUESTO (criterio conservador; un centro de recepción dentro de un sector en riesgo no recibe evacuados, y dentro de uno comprometido nunca)"

# --- Constancias de evacuación ---
distancia_max_destino_m:
  valor: 500
  fuente: SUPUESTO (si el destino GPS de la constancia queda a más de esta distancia del centro elegido, la evacuación se marca "con discrepancia" para revisar; no es una acusación)
vigencia_codigo_horas:
  valor: 72
  fuente: SUPUESTO (horas durante las que el código de confirmación sirve por SMS; el operador puede reabrir la consulta con un código nuevo)
confirmacion_sms_invalidos_por_hora:
  valor: 5
  fuente: SUPUESTO (intentos fallidos por hora de un mismo remitente contra un mismo código existente; superado el tope se ignora a ese remitente para ese código)
confirmacion_sms_fallos_por_codigo:
  valor: 10
  fuente: SUPUESTO (intentos fallidos por hora contra un mismo código, sumando todos los remitentes; superado el tope el código queda invalidado para SMS y el operador puede reabrir la consulta con uno nuevo)
confirmacion_sms_desconocidos_por_hora:
  valor: 20
  fuente: SUPUESTO (códigos inexistentes probados por hora desde un mismo remitente; superado el tope se ignoran sus códigos inexistentes, pero un código válido de su teléfono registrado sigue funcionando)

# --- Seguimiento de la cuadrilla ---
velocidad_cuadrilla_kmh:
  valor: 40
  fuente: SUPUESTO (velocidad media de una cuadrilla en camino hacia el pedido; mezcla pavimento, ripio y tierra; se usa solo para estimar la llegada)
posicion_vieja_minutos:
  valor: 5
  fuente: SUPUESTO (pasado este tiempo sin recibir la posición de la cuadrilla, se avisa que la posición es vieja y la llegada estimada puede no ser confiable)
intervalo_min_posicion_s:
  valor: 10
  fuente: SUPUESTO (segundos mínimos entre dos posiciones de una misma cuadrilla; antes se responde 429)
posicion_vencida_minutos:
  valor: 30
  fuente: SUPUESTO (pasado este tiempo sin recibir la posición de la cuadrilla, la posición se considera vencida, no se muestra a nadie y se borra en la siguiente lectura o envío. Retención mínima, Ley 25.326)
