services:
  db:
    # Tag 16-3.4-3.6.1 verificado con `docker manifest inspect`
    image: pgrouting/pgrouting:16-3.4-3.6.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evacuaciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-evacuaciones}
    ports:
      # Solo en la máquina local: la base nunca se publica hacia la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evacuaciones}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-evacuaciones}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081}
      PERMITIR_DATOS_POST_CORTE: ${PERMITIR_DATOS_POST_CORTE:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      # En el demo local (http://localhost) la cookie no puede ser Secure; con ENTORNO=produccion
      # el backend la fuerza a Secure y oculta /docs y /openapi.json.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENTORNO: ${ENTORNO:-desarrollo}
      # Usuarios y datos de demostración: encendido en el demo; poner SEED_DEMO=false en producción.
      SEED_DEMO: ${SEED_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      CANAL_HMAC_SECRET: ${CANAL_HMAC_SECRET:-}
      # El código del contenedor no está dentro del repo: los datos se montan en solo lectura.
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    # Aplica las migraciones y la carga inicial (idempotente) antes de arrancar la API.
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
